<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plain Text Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true">Aa</div>
      <div>
        <h1>Plain Text Helper</h1>
        <p class="sub">Makes coded text readable on Reddit</p>
      </div>
    </header>

    <label class="toggle-row">
      <span>Show plain text on Reddit</span>
      <input type="checkbox" id="enabled" checked />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section class="manual">
      <label for="input">Check a code</label>
      <textarea
        id="input"
        rows="3"
        placeholder="Paste a coded line here…"
        spellcheck="false"
      ></textarea>
      <div id="output" class="output" hidden></div>
    </section>

    <footer>
      <span>On Reddit, plain text shows next to coded lines. Click a link to open it, or the icon to copy.</span>
    </footer>

    <script src="src/decoder.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
