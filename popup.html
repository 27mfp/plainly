<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base64 Decoder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true">64</div>
      <div>
        <h1>Base64 Decoder</h1>
        <p class="sub">Auto-decode on pages like Reddit</p>
      </div>
    </header>

    <label class="toggle-row">
      <span>Enable decoding</span>
      <input type="checkbox" id="enabled" checked />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section class="manual">
      <label for="input">Try a string</label>
      <textarea
        id="input"
        rows="3"
        placeholder="Paste base64 here…"
        spellcheck="false"
      ></textarea>
      <div id="output" class="output" hidden></div>
    </section>

    <footer>
      <span>Click a green badge on any page to copy the decoded text.</span>
    </footer>

    <script src="src/decoder.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
