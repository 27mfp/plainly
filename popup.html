<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plainly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true">
        <img src="icons/icon48.png" width="36" height="36" alt="" />
      </div>
      <div class="brand">
        <h1>Plainly</h1>
        <p class="sub">Coded text → plain text on Reddit</p>
      </div>
      <span class="version" id="version">v1.2.0</span>
    </header>

    <label class="toggle-row">
      <span>Show plain text on Reddit</span>
      <input type="checkbox" id="enabled" checked />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section class="manual">
      <label for="input">Check a code</label>
      <textarea
        id="input"
        rows="3"
        placeholder="Paste a coded line here…"
        spellcheck="false"
      ></textarea>
      <div id="output" class="output" hidden></div>
    </section>

    <footer>
      <span
        >On Reddit, plain text appears next to coded lines. Open a link or use
        the copy icon.</span
      >
      <div class="footer-row">
        <span>Open source · MIT</span>
      </div>
    </footer>

    <script src="src/decoder.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
